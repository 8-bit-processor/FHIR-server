<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FHIR API Interactive Client</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
        <style>
            body {
                padding-top: 20px;
            }
            .response-area {
                background-color: #f8f9fa;
                border: 1px solid #dee2e6;
                border-radius: .25rem;
                padding: 1rem;
                margin-top: 1rem;
                max-height: 600px;
                overflow-y: auto;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            .nav-tabs {
                margin-bottom: 1rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="mb-4">FHIR API Interactive Client</h1>
    
            <div class="mb-3">
                <label for="fhir-server" class="form-label">FHIR Server Base URL</label>
                <input type="text" class="form-control" id="fhir-server" value="{{ fhir_server_url }}">
            </div>
            <hr/>
    
            <nav>
                <div class="nav nav-tabs" id="nav-tab" role="tablist">
                    <button class="nav-link active" id="nav-read-tab" data-bs-toggle="tab" data-bs-target="#nav-read" type="button" role="tab" aria-controls="nav-read" aria-selected="true">Read</button>
                    <button class="nav-link" id="nav-search-tab" data-bs-toggle="tab" data-bs-target="#nav-search" type="button" role="tab" aria-controls="nav-search" aria-selected="false">Search</button>
                    <button class="nav-link" id="nav-create-tab" data-bs-toggle="tab" data-bs-target="#nav-create" type="button" role="tab" aria-controls="nav-create" aria-selected="false">Create</button>
                     <button class="nav-link" id="nav-update-tab" data-bs-toggle="tab" data-bs-target="#nav-update" type="button" role="tab" aria-controls="nav-update" aria-selected="false">Update</button>
                    <button class="nav-link" id="nav-delete-tab" data-bs-toggle="tab" data-bs-target="#nav-delete" type="button" role="tab" aria-controls="nav-delete" aria-selected="false">Delete</button>
                    <button class="nav-link" id="nav-patient-tab" data-bs-toggle="tab" data-bs-target="#nav-patient" type="button" role="tab" aria-controls="nav-patient" aria-selected="false">Patient Data</button>
                </div>
            </nav>
    
            <div class="tab-content" id="nav-tabContent">
                <!-- Read Tab -->
                <div class="tab-pane fade show active" id="nav-read" role="tabpanel" aria-labelledby="nav-read-tab">
                    <div class="input-group mt-3">
                        <span class="input-group-text">GET</span>
                        <input type="text" class="form-control" id="read-path" placeholder="e.g., Patient/123">
                        <button class="btn btn-primary" id="btn-read">Read</button>
                    </div>
                </div>
    
                <!-- Search Tab -->
                <div class="tab-pane fade" id="nav-search" role="tabpanel" aria-labelledby="nav-search-tab">
                    <div class="input-group mt-3">
                        <span class="input-group-text">GET</span>
                         <input type="text" class="form-control" id="search-path" placeholder="e.g., Patient?name=John">
                        <button class="btn btn-primary" id="btn-search">Search</button>
                    </div>
                </div>
    
                <!-- Create Tab -->
                <div class="tab-pane fade" id="nav-create" role="tabpanel" aria-labelledby="nav-create-tab">
                    <div class="input-group mt-3">
                         <span class="input-group-text">POST</span>
                        <input type="text" class="form-control" id="create-path" placeholder="e.g., Patient">
                    </div>
                    <div class="form-floating mt-2">
                        <textarea class="form-control" placeholder="FHIR Resource JSON" id="create-payload" style="height: 200px"></textarea>
                        <label for="create-payload">FHIR Resource JSON</label>
                    </div>
                    <button class="btn btn-success mt-2" id="btn-create">Create</button>
                </div>
    
                <!-- Update Tab -->
                <div class="tab-pane fade" id="nav-update" role="tabpanel" aria-labelledby="nav-update-tab">
                    <div class="input-group mt-3">
                        <span class="input-group-text">PUT</span>
                        <input type="text" class="form-control" id="update-path" placeholder="e.g., Patient/123">
                    </div>
                    <div class="form-floating mt-2">
                        <textarea class="form-control" placeholder="FHIR Resource JSON" id="update-payload" style="height: 200px"></textarea>
                        <label for="update-payload">FHIR Resource JSON</label>
                    </div>
                    <button class="btn btn-warning mt-2" id="btn-update">Update</button>
                </div>
    
                <!-- Delete Tab -->
                <div class="tab-pane fade" id="nav-delete" role="tabpanel" aria-labelledby="nav-delete-tab">
                     <div class="input-group mt-3">
                        <span class="input-group-text">DELETE</span>
                        <input type="text" class="form-control" id="delete-path" placeholder="e.g., Patient/123">
                        <button class="btn btn-danger" id="btn-delete">Delete</button>
                    </div>
                </div>
    
                <!-- Patient Data Tab -->
                <div class="tab-pane fade" id="nav-patient" role="tabpanel" aria-labelledby="nav-patient-tab">
                    <h4 class="mt-3">Fetch Patient-Specific Data</h4>
                    <div class="input-group mb-3">
                        <span class="input-group-text">Patient ID</span>
                        <input type="text" class="form-control" id="patient-id-input" list="patient-id-list" placeholder="Start typing a name or enter an ID...">
                        <datalist id="patient-id-list"></datalist>
                    </div>
                    <div class="d-grid gap-2 d-md-block mb-3">
                        <button class="btn btn-info" id="btn-get-medications">Get Medications</button>
                        <button class="btn btn-info" id="btn-get-problems">Get Problems</button>
                        <button class="btn btn-info" id="btn-get-appointments">Get Appointments</button>
                                            <button class="btn btn-info" id="btn-get-diagnostic-reports">Get Diagnostic Reports</button>
                                            <button class="btn btn-info" id="btn-get-procedures">Get Procedures</button>
                                            <button class="btn btn-info" id="btn-get-labs">Get Lab Reports</button>
                                        </div>                    <div id="patient-data-response" class="response-area">
                        <span class="text-muted">Patient specific data will appear here...</span>
                    </div>
                </div>
            </div>
    
            <div class="row mt-4">
                <div class="col-md-6">
                    <h3>Formatted View</h3>
                    <div id="formatted-response-area" class="response-area">
                        <span class="text-muted">Formatted, human-readable output will appear here...</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <h3>Raw JSON Response</h3>
                    <div id="response-area" class="response-area">
                        <span class="text-muted">Raw JSON response from the server will appear here...</span>
                    </div>
                </div>
            </div>
        </div>
    
        <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    </body>
</html>
