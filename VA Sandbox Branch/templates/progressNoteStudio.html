<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Note Studio</title>
    <style>
body {
    font-family: sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
}

header {
    background-color: #333;
    color: white;
    padding: 10px 20px;
    text-align: center;
}

.container {
    display: flex;
    height: calc(100vh - 50px);
}

#sidebar {
    width: 250px;
    background-color: #f0f0f0;
    padding: 20px;
    border-right: 1px solid #ccc;
    overflow-y: auto;
}

#main-content {
    flex-grow: 1;
    padding: 20px;
    overflow-y: auto;
}

#notes-container {
    height: calc(100% - 150px);
    overflow-y: scroll;
    margin-bottom: 20px;
    border: 1px solid #ccc;
    padding: 10px;
}

.note {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
}

.note input[type="text"] {
    font-weight: bold;
    font-size: 1.1em;
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 3px;
    margin-bottom: 5px;
}

.note textarea {
    flex-grow: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 3px;
    resize: vertical;
    min-height: 100px;
    width: calc(100% - 22px); /* Adjust for padding and border */
}

.note button {
    background-color: #f44336;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 5px;
    width: 100px;
    align-self: flex-end;
}

.note button.copy-section {
    background-color: #2196F3;
    width: 120px;
    margin-right: 5px;
}

#controls {
    margin-top: 20px;
}

#add-note, #save-notes, #save-as-button, #load-button, #import-button, #copy-to-clipboard, #clear-notes {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 3px;
    cursor: pointer;
    margin-right: 10px;
    font-size: 14px;
    font-weight: normal;
    height: 44px;
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
}

#copy-to-clipboard {
    font-size: 14px;
    padding: 10px 12px;
    min-width: 140px;
}

#clear-notes {
    background-color: #f44336;
}

#notes-index {
    list-style-type: none;
    padding: 0;
}

#notes-index li {
    padding: 5px;
    cursor: pointer;
}

#notes-index li:hover {
    background-color: #ddd;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background-color: #333;
}

header h1 {
    margin: 0;
    flex-grow: 1;
}

#back-to-main {
    background-color: #2196F3;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 3px;
    cursor: pointer;
}
    </style>
</head>
<body>
    <header>
        <h1>Progress Note Studio</h1>
        <button id="back-to-main">← Back to Main</button>
    </header>
    <div class="container">
        <aside id="sidebar">
            <h2>Patient Selection</h2>
            <select id="patient-select" style="width: 100%; margin-bottom: 20px;">
                <option value="">Select a patient...</option>
            </select>
            <button id="load-patient-data" style="width: 100%; margin-bottom: 20px;">Load Patient Data</button>
            <h2>Section Index</h2>
            <ul id="notes-index"></ul>
            <hr>
            <h2>Import Window</h2>
            <textarea id="import-textarea" placeholder="Paste your document here..."></textarea>
        </aside>
        <main id="main-content">
            <div id="notes-container"></div>
            <div id="controls">
                <button id="add-note">Add Note Section</button>
                <button id="process-document-ai" style="background-color: #9C27B0; color: white; border: none; padding: 10px 15px; border-radius: 3px; cursor: pointer; margin-right: 10px; height: 44px;">Process Document w/AI</button>
                <button id="copy-to-clipboard">Copy Document</button>
                <button id="clear-notes">Clear Note Sections</button>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
document.addEventListener('DOMContentLoaded', function() {
    const notesContainer = document.getElementById('notes-container');
    const addNoteButton = document.getElementById('add-note');
    const copyToClipboardButton = document.getElementById('copy-to-clipboard');
    const clearNotesButton = document.getElementById('clear-notes');
    const importTextarea = document.getElementById('import-textarea');
    const notesIndex = document.getElementById('notes-index');
    const backToMainButton = document.getElementById('back-to-main');
    const processDocumentAIButton = document.getElementById('process-document-ai');
    const loadFromFhirButton = document.getElementById('load-from-fhir');

    // Check if required elements exist
    if (!notesContainer || !addNoteButton || !copyToClipboardButton || !clearNotesButton || !importTextarea || !notesIndex) {
        console.error('Required DOM elements not found');
        return;
    }

    let notes = [];
    let sortable = null;
    let currentPatientId = null;

    // Load patients on page load
    loadPatients();

    function loadPatients() {
        fetch('/patients')
            .then(response => response.json())
            .then(data => {
                const select = document.getElementById('patient-select');
                data.forEach(patient => {
                    const option = document.createElement('option');
                    option.value = patient.id;
                    option.textContent = patient.name;
                    select.appendChild(option);
                });
            })
            .catch(error => console.error('Error loading patients:', error));
    }

    // Patient selection
    document.getElementById('patient-select').addEventListener('change', function() {
        currentPatientId = this.value;
    });

    // Load patient data button
    document.getElementById('load-patient-data').addEventListener('click', loadPatientData);

    function loadPatientData() {
        if (!currentPatientId) {
            alert('Please select a patient first');
            return;
        }

        // Initialize all sections in the standard clinical order
        notes = [
            {title: 'Chief Complaint', content: 'Loading...'},
            {title: 'History of Presenting Illness', content: 'Enter history of presenting illness...'},
            {title: 'Past Medical History', content: 'Loading...'},
            {title: 'Past Surgical History', content: 'Loading...'},
            {title: 'Allergies', content: 'Loading...'},
            {title: 'Medications', content: 'Loading...'},
            {title: 'Vitals', content: 'Loading...'},
            {title: 'Social History', content: 'Enter social history (tobacco, alcohol, drugs, living situation, occupation)...'},
            {title: 'Family History', content: 'Enter family history (hypertension, diabetes, cancer, cardiac disease, psychiatric illness)...'},
            {title: 'Review of Systems', content: 'Enter review of systems findings...'},
            {title: 'Physical Exam', content: 'Enter physical examination findings...'},
            {title: 'Labwork', content: 'Loading...'},
            {title: 'Assessment/Plan', content: 'Enter assessment and treatment plan...'},
            {title: 'Screening and Preventative Care', content: 'Enter preventative care recommendations...'},
            {title: 'Follow-up Plan', content: 'Enter follow-up instructions and next appointment...'},
        ];
        renderNotes();

        // Load problems for Chief Complaint and PMH
        fetch(`/patient/${currentPatientId}/problems`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    // Chief Complaint - first problem
                    const chiefComplaint = data[0].problem || 'No chief complaint available';
                    notes[0].content = chiefComplaint;
                    
                    // Past Medical History - all problems
                    const pmhContent = data.length > 0 
                        ? data.map(p => `- ${p.problem || 'Unknown problem'} (${p.clinicalStatus || 'Status unknown'})`).join('\n')
                        : 'No past medical history found';
                    notes[2].content = pmhContent;
                    
                    renderNotes();
                }
            })
            .catch(error => {
                console.error('Error loading problems:', error);
                notes[0].content = 'Error loading chief complaint';
                notes[2].content = 'Error loading past medical history';
                renderNotes();
            });

        // Load procedures for Past Surgical History
        fetch(`/patient/${currentPatientId}/procedures`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                const procContent = Array.isArray(data) && data.length > 0
                    ? data.map(p => `- ${p.type || 'Unknown procedure'} (${new Date(p.performedDateTime).toLocaleDateString()})`).join('\n')
                    : 'No past surgical history found';
                notes[3].content = procContent;
                renderNotes();
            })
            .catch(error => {
                console.error('Error loading procedures:', error);
                notes[3].content = 'Error loading past surgical history';
                renderNotes();
            });

        // Load Allergies
        fetch(`/patient/${currentPatientId}/allergies`)
            .then(response => response.json())
            .then(data => {
                const allergyContent = Array.isArray(data) && data.length > 0
                    ? data.map(a => `- ${a.substance || 'Unknown substance'} (Status: ${a.status || 'Unknown'}, Criticality: ${a.criticality || 'Unknown'})`).join('\n')
                    : 'No allergies found';
                notes[4].content = allergyContent;
                renderNotes();
            })
            .catch(error => {
                console.error('Error loading allergies:', error);
                notes[4].content = 'Error loading allergies';
                renderNotes();
            });

        // Load medications
        fetch(`/patient/${currentPatientId}/medications`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                const medsContent = Array.isArray(data) && data.length > 0
                    ? data.map(m => `- ${m.medication || 'Unknown medication'}\n  Status: ${m.status || 'Unknown'}\n  Intent: ${m.intent || 'Unknown'}\n  Authored: ${m.authoredOn || 'Unknown'}`).join('\n\n')
                    : 'No current medications found';
                notes[5].content = medsContent;
                renderNotes();
            })
            .catch(error => {
                console.error('Error loading medications:', error);
                notes[5].content = 'Error loading medications';
                renderNotes();
            });

        // Load Vitals
        fetch(`/patient/${currentPatientId}/vitals`)
            .then(response => response.json())
            .then(data => {
                const vitalsContent = Array.isArray(data) && data.length > 0
                    ? data.map(v => `- ${v.code || 'Unknown vital'}: ${v.value || 'N/A'} ${v.unit || ''} (${v.date ? new Date(v.date).toLocaleDateString() : 'N/A'})`).join('\n')
                    : 'No vitals found';
                notes[6].content = vitalsContent;
                renderNotes();
            })
            .catch(error => {
                console.error('Error loading vitals:', error);
                notes[6].content = 'Error loading vitals';
                renderNotes();
            });

        // Load labs for Labwork section
        fetch(`/patient/${currentPatientId}/labs`)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                const labContent = Array.isArray(data) && data.length > 0
                    ? data.map(lab => {
                        const date = lab.effectiveDateTime ? new Date(lab.effectiveDateTime).toLocaleDateString() : 'Unknown date';
                        return `- ${lab.type || 'Unknown test'} (${date})\n  Status: ${lab.status || 'Unknown'}\n  Conclusion: ${lab.conclusion || 'No conclusion'}`;
                      }).join('\n\n')
                    : 'No lab results found';
                notes[11].content = labContent;
                
                // Fetch Diagnostic Reports to append to Labwork
                return fetch(`/patient/${currentPatientId}/diagnostic-reports`);
            })
            .then(response => response.json())
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    const reportContent = data.map(r => `- ${r.type || 'Unknown Report'} (${r.effectiveDateTime ? new Date(r.effectiveDateTime).toLocaleDateString() : 'N/A'})\n  Status: ${r.status || 'Unknown'}\n  Conclusion: ${r.conclusion || 'No conclusion'}`).join('\n\n');
                    notes[11].content += '\n\nDIAGNOSTIC REPORTS:\n' + reportContent;
                }
                renderNotes();
            })
            .catch(error => {
                console.error('Error loading labs/reports:', error);
                notes[11].content = 'Error loading lab/diagnostic results';
                renderNotes();
            });
    }

    function loadNotesFromFHIR() {
        if (!currentPatientId) {
            alert('Please select a patient first');
            return;
        }

        notesContainer.innerHTML = '<span class="text-muted">Searching for existing notes...</span>';

        fetch('/fhir-proxy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                method: 'GET',
                resource_type: 'DocumentReference',
                params: { patient: currentPatientId }
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.entry && data.entry.length > 0) {
                // Find the most recent Progress Note (LOINC 34109-9 or 11506-3)
                const latestNoteEntry = data.entry.find(e => {
                    const type = e.resource.type;
                    return type && type.coding && type.coding.some(c => c.code === '34109-9' || c.code === '11506-3');
                }) || data.entry[0];

                const latestNote = latestNoteEntry.resource;
                const binaryUrl = latestNote.content[0].attachment.url;
                
                // Fetch the Binary resource
                fetch('/fhir-proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        method: 'GET',
                        fhir_url: binaryUrl
                    })
                })
                .then(response => response.json())
                .then(binaryData => {
                    // Binary resource has the content in the 'data' field, Base64 encoded
                    if (binaryData.data) {
                        try {
                            const decodedContent = atob(binaryData.data);
                            parseNoteContent(decodedContent);
                        } catch (e) {
                            console.error('Error decoding note data:', e);
                            alert('Found note but could not decode its content.');
                        }
                    } else {
                        alert('Found note record but the content was empty.');
                    }
                })
                .catch(error => {
                    console.error('Error fetching binary content:', error);
                    alert('Error retrieving note content.');
                });
            } else {
                alert('No existing progress notes found for this patient.');
                renderNotes();
            }
        })
        .catch(error => {
            console.error('Error loading notes from FHIR:', error);
            alert('Error searching for notes.');
            renderNotes();
        });
    }

    function parseNoteContent(content) {
        // Split by double newline (standard section break)
        const sections = content.split(/\n\n+/);
        notes = [];

        sections.forEach(section => {
            const lines = section.trim().split('\n');
            if (lines.length >= 1) {
                const title = lines[0];
                const noteBody = lines.slice(1).join('\n');
                notes.push({ title, content: noteBody });
            }
        });

        if (notes.length === 0) {
            notes = [{ title: 'Imported Note', content: content }];
        }

        renderNotes();
    }

    function renderNotes() {
        notesContainer.innerHTML = '';
        notes.forEach((note, index) => {
            const noteElement = createNoteElement(note, index);
            notesContainer.appendChild(noteElement);
        });
        renderNotesIndex();
    }

    function renderNotesIndex() {
        if (sortable) {
            sortable.destroy();
            sortable = null;
        }
        notesIndex.innerHTML = '';
        notes.forEach((note, index) => {
            const title = note.title || 'Untitled Note';
            const li = document.createElement('li');
            li.textContent = title;
            li.dataset.index = index;
            li.addEventListener('click', () => {
                const noteElement = notesContainer.querySelector(`[data-index="${index}"]`);
                if (noteElement) {
                    noteElement.scrollIntoView({ behavior: 'smooth' });
                }
            });
            notesIndex.appendChild(li);
        });

        // Only initialize sortable if Sortable is available
        if (typeof Sortable !== 'undefined') {
            sortable = new Sortable(notesIndex, {
                animation: 150,
                onEnd: function () {
                    const newNotes = [];
                    Array.from(notesIndex.children).forEach(child => {
                        newNotes.push(notes[parseInt(child.dataset.index)]);
                    });
                    notes = newNotes;
                    renderNotes();
                }
            });
        } else {
            console.warn('SortableJS library not loaded, drag-and-drop disabled');
        }
    }


    function createNoteElement(note, index) {
        const noteDiv = document.createElement('div');
        noteDiv.classList.add('note');
        noteDiv.dataset.index = index;

        const titleInput = document.createElement('input');
        titleInput.type = 'text';
        titleInput.placeholder = 'New Section Title';
        titleInput.value = note.title;
        titleInput.dataset.index = index;
        titleInput.addEventListener('change', updateNote);

        const textarea = document.createElement('textarea');
        textarea.value = note.content;
        textarea.dataset.index = index;
        textarea.addEventListener('change', updateNote);

        const buttonContainer = document.createElement('div');
        buttonContainer.style.display = 'flex';
        buttonContainer.style.gap = '5px';
        buttonContainer.style.alignSelf = 'flex-end';

        const copyButton = document.createElement('button');
        copyButton.textContent = 'Copy Section';
        copyButton.classList.add('copy-section');
        copyButton.dataset.index = index;
        copyButton.addEventListener('click', copySectionToClipboard);
const aiSectionButton = document.createElement('button');
aiSectionButton.textContent = 'Process w/AI';
aiSectionButton.style.backgroundColor = '#9C27B0';
aiSectionButton.style.color = 'white';
aiSectionButton.style.border = 'none';
aiSectionButton.style.borderRadius = '3px';
aiSectionButton.style.cursor = 'pointer';
aiSectionButton.style.marginRight = '5px';
aiSectionButton.style.width = '120px';
aiSectionButton.dataset.index = index;
aiSectionButton.addEventListener('click', processSectionAI);

        const removeButton = document.createElement('button');
        removeButton.textContent = 'Remove';
        removeButton.dataset.index = index;
        removeButton.addEventListener('click', removeNote);
        
        buttonContainer.appendChild(copyButton);
        buttonContainer.appendChild(aiSectionButton);
        buttonContainer.appendChild(removeButton);
        
        noteDiv.appendChild(titleInput);
        noteDiv.appendChild(textarea);
        noteDiv.appendChild(buttonContainer);

        return noteDiv;
    }

    function addNote() {
        notes.push({title: 'New Section Title', content: ''});
        renderNotes();
    }

    function removeNote(event) {
        const index = event.target.dataset.index;
        notes.splice(index, 1);
        renderNotes();
    }

    function updateNote(event) {
        const index = event.target.dataset.index;
        const titleInput = notesContainer.querySelector(`[data-index="${index}"] input`);
        const textarea = notesContainer.querySelector(`[data-index="${index}"] textarea`);
        notes[index] = {
            title: titleInput.value,
            content: textarea.value
        };
        renderNotesIndex();
    }

    function copySectionToClipboard(event) {
        const index = event.target.dataset.index;
        const note = notes[index];
        let textToCopy = note.title + '\n' + note.content;

        navigator.clipboard.writeText(textToCopy)
            .then(() => {
                const originalText = event.target.textContent;
                event.target.textContent = 'Copied!';
                event.target.style.backgroundColor = '#FFD700';
                
                setTimeout(() => {
                    event.target.textContent = originalText;
                    event.target.style.backgroundColor = '#2196F3';
                }, 400);
            })
            .catch(err => {
                console.error('Error copying section: ', err);
                alert('Error copying section.');
            });
    }

    function processSectionAI(event) {
        const index = event.target.dataset.index;
        const note = notes[index];
        alert(`AI processing for section "${note.title}" will be added here soon.`);
    }

    function processDocumentAI() {
        if (notes.length === 0) {
            alert('No document content to process.');
            return;
        }
        alert('Full document AI processing will be added here soon.');
    }

    function importFromString() {
        const text = importTextarea.value;
        if (!text) {
            return;
        }

        const noteSections = text.split(/\n\s*\n/);

        noteSections.forEach(section => {
            const lines = section.split('\n');
            if (lines.length > 0) {
                const title = lines[0];
                const content = lines.slice(1).join('\n');
                notes.push({ title, content });
            }
        });

        renderNotes();
        importTextarea.value = '';
    }

    function copyToClipboard() {
        let textToCopy = '';
        notes.forEach((note, index) => {
            textToCopy += note.title + '\n' + note.content;
            if (index < notes.length - 1) {
                textToCopy += '\n\n';
            }
        });

        // Try modern clipboard API first
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    showCopySuccess();
                })
                .catch(err => {
                    console.error('Error copying notes: ', err);
                    fallbackCopyTextToClipboard(textToCopy);
                });
        } else {
            fallbackCopyTextToClipboard(textToCopy);
        }
    }

    function fallbackCopyTextToClipboard(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            const successful = document.execCommand('copy');
            if (successful) {
                showCopySuccess();
            } else {
                alert('Failed to copy notes.');
            }
        } catch (err) {
            console.error('Fallback: Oops, unable to copy', err);
            alert('Error copying notes.');
        }
        document.body.removeChild(textArea);
    }

    function showCopySuccess() {
        const originalColor = '#4CAF50';
        copyToClipboardButton.style.backgroundColor = '#FFD700';
        copyToClipboardButton.textContent = 'Copied!';
        
        // Reset button color and text after 0.4 seconds
        setTimeout(() => {
            copyToClipboardButton.style.backgroundColor = originalColor;
            copyToClipboardButton.textContent = 'Copy Document';
        }, 400);
    }

    function clearNotes() {
        if (confirm('Are you sure you want to clear all note sections? This action cannot be undone.')) {
            notes = [];
            renderNotes();
            currentPatientId = null;
            document.getElementById('patient-select').value = '';
        }
    }

    function goBackToMain() {
        window.location.href = '/';
    }

    addNoteButton.addEventListener('click', addNote);
    if (loadFromFhirButton) loadFromFhirButton.addEventListener('click', loadNotesFromFHIR);
    if (processDocumentAIButton) processDocumentAIButton.addEventListener('click', processDocumentAI);
    copyToClipboardButton.addEventListener('click', copyToClipboard);
    clearNotesButton.addEventListener('click', clearNotes);
    if (backToMainButton) backToMainButton.addEventListener('click', goBackToMain);
    
    importTextarea.addEventListener('paste', (event) => {
        event.preventDefault(); // Prevent the default paste behavior
        const pastedText = event.clipboardData.getData('text');
        importTextarea.value = pastedText;
        importFromString();
    });
});
    </script>
</body>
</html>
